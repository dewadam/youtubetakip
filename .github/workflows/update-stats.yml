name: YouTube İstatistiklerini Güncelle

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: İstatistikleri çek
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_stats.py
      - name: Değişiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stats.json
          if git diff --staged --quiet; then
            echo "Değişiklik yok."; exit 0
          fi
          git commit -m "chore: stats $(date -u +%Y-%m-%dT%H:%MZ)"
          if [ $(git rev-list --count HEAD) -gt 500 ]; then
            git checkout --orphan temp
            git commit -m "chore: geçmiş sıfırlandı"
            git branch -M temp main
            git push --force origin main
          else
            git push
          fi
